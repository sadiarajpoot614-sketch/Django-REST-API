<!DOCTYPE html>
<html>
<head>
    <title>Django REST API</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
            padding:50px;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:15px;
            width:500px;
            margin:auto;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            color:#0d6efd;
        }

        button{
            background:#0d6efd;
            color:white;
            padding:12px 25px;
            border:none;
            border-radius:8px;
        }

        a{
            color:white;
            text-decoration:none;
        }
    </style>

</head>

<body>

<div class="box">

<h1>Welcome to Django REST API 🚀</h1>

<p>My first Django API project is running successfully.</p>

<button>
<a href="/api/">Open API</a>
</button>

</div>

</body>
</html>
